services:
  # ── Streamlit Dashboard (web service) ────────────────────────────
  - type: web
    name: mlb-vip-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run src/control_panel.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SPORTSODDS_API_KEY
        sync: false
      - key: PINNAPI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mlb-postgres
          property: connectionString
      - key: MLB_CACHE_PATH
        value: /data/cache
      - key: MLB_OUTPUT_DIR
        value: /data/output
      - key: MLB_BACKUP_DIR
        value: /data/backups
      - key: MLB_TIMEZONE
        value: America/New_York
      - key: MLB_LOG_LEVEL
        value: INFO
      - key: MLB_LOG_FORMAT
        value: json
      - key: MLB_ENVIRONMENT
        value: production
      - key: MLB_SCHEDULER_ENABLED
        value: "true"
      - key: MLB_SHADOW_MODE
        value: "true"
    disk:
      name: mlb-data
      mountPath: /data
      sizeGB: 1

  # Read-only customer presentation. Admin/debug controls remain in the
  # dashboard above; this service exposes only the customer view.
  - type: web
    name: mlb-vip-customer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run src/customer_view.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DATABASE_URL
        fromDatabase:
          name: mlb-postgres
          property: connectionString
      - key: MLB_CUSTOMER_ACCESS_TOKEN
        sync: false
      - key: MLB_TIMEZONE
        value: America/New_York
      - key: MLB_ENVIRONMENT
        value: production
      - key: MLB_SHADOW_MODE
        value: "true"

  # ── Background Worker (long-running service) ─────────────────────
  - type: worker
    name: mlb-vip-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SPORTSODDS_API_KEY
        sync: false
      - key: PINNAPI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mlb-postgres
          property: connectionString
      - key: MLB_CACHE_PATH
        value: /data/cache
      - key: MLB_OUTPUT_DIR
        value: /data/output
      - key: MLB_BACKUP_DIR
        value: /data/backups
      - key: MLB_TIMEZONE
        value: America/New_York
      - key: MLB_LOG_LEVEL
        value: INFO
      - key: MLB_LOG_FORMAT
        value: json
      - key: MLB_ENVIRONMENT
        value: production
      - key: MLB_SCHEDULER_ENABLED
        value: "true"
      - key: MLB_SHADOW_MODE
        value: "true"
    disk:
      name: mlb-data-worker
      mountPath: /data
      sizeGB: 1

databases:
  # ── PostgreSQL Database ──────────────────────────────────────────
  - name: mlb-postgres
    databaseName: mlb_model
    plan: basic-256mb
