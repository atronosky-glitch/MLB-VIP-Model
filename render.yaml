services:
  # ── Streamlit Dashboard (web service) ────────────────────────────
  - type: web
    name: mlb-vip-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run src/control_panel.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SPORTSODDS_API_KEY
        sync: false
      - key: PINNAPI_API_KEY
        sync: false
      # WNBA odds provider (The Odds API) — needed here too, not just on
      # the worker. The Multi-League Health tab's "Upcoming Games
      # Discovered" section calls the same live schedule-discovery
      # function the worker uses, but it runs inside this dashboard
      # process, so it needs its own copy of this key. Without it, that
      # section's WNBA column silently falls back to "0 games" (the
      # discovery call raises OddsAPIKeyError, caught and swallowed) —
      # no crash, easy to miss. Must be set manually in the Render
      # dashboard, same value as mlb-vip-worker's.
      - key: THE_ODDS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mlb-postgres
          property: connectionString
      - key: MLB_CACHE_PATH
        value: /data/cache
      - key: MLB_OUTPUT_DIR
        value: /data/output
      - key: MLB_BACKUP_DIR
        value: /data/backups
      - key: MLB_TIMEZONE
        value: America/New_York
      - key: MLB_LOG_LEVEL
        value: INFO
      - key: MLB_LOG_FORMAT
        value: json
      - key: MLB_ENVIRONMENT
        value: production
      - key: MLB_SCHEDULER_ENABLED
        value: "true"
      - key: MLB_SHADOW_MODE
        value: "true"
    disk:
      name: mlb-data
      mountPath: /data
      sizeGB: 1

  # Read-only customer presentation. Admin/debug controls remain in the
  # dashboard above; this service exposes only the customer view.
  - type: web
    name: mlb-vip-customer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run src/customer_view.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DATABASE_URL
        fromDatabase:
          name: mlb-postgres
          property: connectionString
      - key: MLB_CUSTOMER_ACCESS_TOKEN
        sync: false
      - key: MLB_TIMEZONE
        value: America/New_York
      - key: MLB_ENVIRONMENT
        value: production
      - key: MLB_SHADOW_MODE
        value: "true"
      # Customer accounts (src/customer_accounts.py) -- email
      # verification via SendGrid. Reserved here (sync: false) so
      # Render prompts for them in the dashboard rather than storing
      # values in this blueprint; account creation itself works with
      # these unset, it just can't send a verification email until
      # they're filled in.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SITE_BASE_URL
        sync: false
      # Deliberately NOT declared here: MLB_CUSTOMER_FREE_ACCESS. Leaving
      # it undeclared keeps today's code default ("true" -- full access,
      # no account required) in effect until the operator explicitly
      # sets it to "false" in the Render dashboard, a deliberate,
      # separate decision this blueprint never makes on its own.

  # ── Background Worker (long-running service) ─────────────────────
  - type: worker
    name: mlb-vip-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.worker
    envVars:
      # Discord webhook URLs for the arb-middle-scan job's real-time
      # alerts (src/worker.py::_deliver_new_opportunity_alerts, every
      # ARB_MIDDLE_SCAN_INTERVAL_MINUTES). Three separate channels, no
      # fallback between them -- leaving one unset just means that
      # category never alerts, not that it spills into another channel.
      # Found live 2026-09-15: none of these three keys were declared
      # anywhere in this blueprint, so this worker service has never had
      # a value for them unless manually added out-of-band in the Render
      # dashboard -- which would fully explain zero alerts ever firing.
      # Must be set manually in the Render dashboard (webhook URLs are
      # credentials -- anyone holding one can post to that channel --
      # so none are committed here).
      - key: MLB_DISCORD_WEBHOOKS
        sync: false
      - key: MLB_DISCORD_WEBHOOKS_ARB_MIDDLE
        sync: false
      - key: MLB_DISCORD_WEBHOOKS_MIDDLE
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SPORTSODDS_API_KEY
        sync: false
      - key: PINNAPI_API_KEY
        sync: false
      # WNBA odds provider (The Odds API, the-odds-api.com) — separate
      # from SportsGameOdds above, required for src/league_schedule.py's
      # WNBA scheduling checks and src/sports/wnba.py's fetch calls to do
      # anything at all. Without this set, WNBA schedule discovery raises
      # OddsAPIKeyError, which is caught and treated as "WNBA
      # unavailable" (no crash, no jobs ever scheduled) — silently inert,
      # not failing loudly, so this is easy to miss without checking the
      # Multi-League Health tab. Must be set manually in the Render
      # dashboard (this key is not committed anywhere in the repo).
      - key: THE_ODDS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mlb-postgres
          property: connectionString
      - key: MLB_CACHE_PATH
        value: /data/cache
      - key: MLB_OUTPUT_DIR
        value: /data/output
      - key: MLB_BACKUP_DIR
        value: /data/backups
      - key: MLB_TIMEZONE
        value: America/New_York
      - key: MLB_LOG_LEVEL
        value: INFO
      - key: MLB_LOG_FORMAT
        value: json
      - key: MLB_ENVIRONMENT
        value: production
      - key: MLB_SCHEDULER_ENABLED
        value: "true"
      - key: MLB_SHADOW_MODE
        value: "true"
    disk:
      name: mlb-data-worker
      mountPath: /data
      sizeGB: 1

databases:
  # ── PostgreSQL Database ──────────────────────────────────────────
  - name: mlb-postgres
    databaseName: mlb_model
    plan: basic-256mb
